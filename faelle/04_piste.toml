intro = """
Ein vermeintlich perfekter Skitag im beschaulichen Obersaxen. Calzi und Pete haben
mal wieder Carlo Janka in den Schatten gestellt – der eine mit seinem Wedeln, der
andere mit seinen 180ern. Der Rest der Rasselbande ist etwas zurückhaltender und
auch knieschonender unterwegs. Alle genießen die Berge und können dabei sogar noch
etwas lernen (natürlich von Calzi!). Mittags kehren sie gemeinsam im Wali ein, um
sich ihre selbstgeschmierten Brote zu gönnen. Johann bestellt sich, in mittlerweile
nur noch gebrochenem Berndeutsch, zusätzlich eine Ovomaltine, Ranges übertreibt
wieder direkt mit 'ner Suppe und einem Red Bull, und auch Leah gönnt sich etwas mit
den Käsespätzle. Nach diesem Festmahl geht es nachmittags wieder auf die Pisten
Obersaxens. Doch die Idylle trügt. Im Wali herrscht Panik! Jemand hat den
Ovomaltine-Vorrat geklaut! Nur die Rabaukinnen aus Ilanz können dafür
verantwortlich sein! Doch wer hat das wertvolle Pulver gestohlen?
"""

